# Ulozit jako: .github/workflows/watch.yml v repozitari, kde je watch_tickets.py
name: Watch IMAX Odyssea tickets

concurrency:
     group: imax-watcher
     cancel-in-progress: true

on:
  workflow_dispatch: {}       # umoznuje rucni spusteni z GitHub UI

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Zkontrolovat vstupenky
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: python watch_tickets.py

      - name: Ulozit stav zpet do repozitare
        run: |
          git config user.name "ticket-watcher-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "update state"
          git push
